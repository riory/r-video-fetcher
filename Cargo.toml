[package]
name = "r-video-fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = "3"
eframe = "0.32"
fs2 = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
winresource = "0.1"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
